name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest

    # Placeholder values, not secrets, and deliberately obvious ones.
    #
    # No test connects to a database or signs anything a real system would
    # trust. But three test files transitively import the env module, which
    # validates configuration at load and exits the process when it is missing
    # (§7) — so the variables have to be *present*, even though their values are
    # never meaningfully used. JWT_SECRET does get used, to sign tokens that
    # only this test run verifies, so it has to clear the 32-character minimum.
    #
    # Without this the three affected files report "0 tests" and the suite
    # silently shrinks rather than failing loudly, which is how this went
    # unnoticed locally: a developer machine has a .env, so it passes there.
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci_never_connected
      JWT_SECRET: ci-placeholder-secret-not-used-outside-this-run

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # `npm ci` rather than `npm install`: it installs exactly the lockfile
      # and fails if package.json and the lock have drifted, which is the
      # difference between CI proving the committed state works and proving
      # something adjacent to it works.
      - run: npm ci

      - run: npm run lint

      - run: npm run typecheck

      # Server tests need no database or network: Tier 1 is pure, Tier 2 uses a
      # fake driver, and Tier 3 boots the app with stubs that must never be
      # called. Frontend tests run in happy-dom. So CI needs no secrets.
      - run: npm test

      # Catches build-layout breakage — the class of bug that only appears in a
      # compiled tree and would otherwise be found on the deploy after merge.
      - run: npm run build
